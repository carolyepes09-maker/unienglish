name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analizar-y-probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.2
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze

      - name: Pruebas
        run: flutter test

      - name: Build web
        run: flutter build web --release
