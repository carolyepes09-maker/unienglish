<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="UniEnglish - Universidad Libre Colombia">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="UniEnglish">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>UniEnglish</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Splash visible de inmediato (antes de que cargue el JS/WASM de Flutter),
       para no dejar la pantalla en blanco durante la descarga inicial.
       Se retira automáticamente cuando Flutter dispara 'flutter-first-frame'. -->
  <style>
    html, body { margin: 0; height: 100%; background: #1C0A00; }
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1C0A00;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      z-index: 9999;
      transition: opacity 0.25s ease;
    }
    #app-loading .title {
      color: #FFFFFF;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    #app-loading .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(139, 122, 47, 0.25);
      border-top-color: #8B7A2F;
      border-radius: 50%;
      animation: app-loading-spin 0.8s linear infinite;
    }
    @keyframes app-loading-spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <div id="app-loading">
    <div class="title">UniEnglish</div>
    <div class="spinner"></div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Flutter dispara este evento en 'window' apenas pinta su primer frame
    // (que para esta app es la _LoadingScreen de main.dart, ya que Firebase
    // y los servicios todavía pueden seguir cargando). Desde ahí en adelante
    // el propio Flutter maneja su splash, así que retiramos el de HTML.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('app-loading');
      if (el) {
        el.style.opacity = '0';
        setTimeout(function () { el.remove(); }, 250);
      }
    });
  </script>
</body>
</html>
